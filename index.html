<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đua Bi Thần Tốc</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0}
:root{--ink:#4c3f7a;--soft:#8b80b8;--pink:#ff7eb6;--violet:#8b7bff;--mint:#5fe0c0;--card:rgba(255,255,255,.72)}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);height:100vh;height:100dvh;overflow:hidden;
 background:radial-gradient(circle at 12% 18%,#ffd6ea 0,transparent 42%),radial-gradient(circle at 88% 12%,#cfe0ff 0,transparent 45%),radial-gradient(circle at 70% 92%,#c9f5e6 0,transparent 45%),#fff6fb}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.app{display:flex;height:100%;gap:12px;padding:12px}
.side{width:236px;flex-shrink:0;display:flex;flex-direction:column;background:var(--card);border:2px solid #fff;border-radius:28px;
 box-shadow:0 12px 40px rgba(139,123,255,.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);overflow:hidden}
.head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.logo{font-size:22px;font-weight:800;line-height:1;background:linear-gradient(90deg,var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.cnt{font-size:12px;color:var(--soft);font-weight:600;margin-top:2px}
.round{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(139,123,255,.2);font-size:16px;transition:transform .15s}
.round:active{transform:scale(.88)}
.add{padding:8px 14px 12px;display:flex;flex-direction:column;gap:8px}
textarea{width:100%;height:96px;resize:none;border:2px solid #efe9ff;border-radius:16px;padding:8px 12px;font:600 13px 'Be Vietnam Pro',sans-serif;color:var(--ink);background:#fff;outline:none;transition:border-color .2s}
textarea:focus{border-color:var(--violet)}
textarea::placeholder{color:#b9b0dd}
.btn{padding:9px 0;border-radius:16px;color:#fff;font-weight:800;font-size:14px;transition:transform .15s,box-shadow .15s;box-shadow:0 6px 16px rgba(139,123,255,.3)}
.btn:active:not(:disabled){transform:scale(.96)}
.b-add{background:linear-gradient(135deg,var(--mint),#5fb8ff)}
.b-go{background:linear-gradient(135deg,var(--pink),var(--violet));font-size:16px}
.b-reset{background:linear-gradient(135deg,#7d86b8,#5d6399)}
.list{flex:1;overflow-y:auto;padding:4px 12px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;scrollbar-color:#d8cfff transparent}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(139,123,255,.1);animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
.row .n{display:flex;align-items:center;gap:8px;min-width:0;font-weight:800;font-size:13px}
.row .n span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;box-shadow:inset -2px -2px 0 rgba(0,0,0,.12)}
.x{color:#cfc7ee;font-size:15px;padding:0 4px}.x:hover{color:#ff6b8b}
.empty{text-align:center;color:var(--soft);font-size:13px;padding:20px 8px}
.foot{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.clear{color:var(--soft);font-size:12px;font-weight:600;padding:2px}.clear:hover{color:#ff6b8b}
.stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;position:relative}
canvas{height:min(calc(100dvh - 24px),calc((100vw - 280px) * 1.3333));aspect-ratio:3/4;max-width:100%;border-radius:32px;border:4px solid #fff;box-shadow:0 18px 50px rgba(139,123,255,.28);background:#fff}
.toast{position:absolute;top:28px;left:50%;transform:translateX(-50%);pointer-events:none;opacity:0;display:flex;gap:10px;align-items:center;padding:8px 20px;border-radius:99px;background:rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(0,0,0,.15);font-weight:800;font-size:15px;white-space:nowrap}
.toast.show{animation:toast 2.4s ease both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.top{position:absolute;top:24px;right:calc(50% - min(calc(50dvh - 12px),calc((100vw - 280px) * .6667)) + 16px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.chip{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.92);box-shadow:0 4px 12px rgba(0,0,0,.1);font-weight:800;font-size:12px;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
.slow{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);padding:4px 16px;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--violet));color:#fff;font-weight:800;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none}
.slow.on{opacity:1}
.modal{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(139,123,255,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal.on{display:flex}
.card{width:290px;max-width:90vw;padding:22px;border-radius:32px;background:#fff;text-align:center;box-shadow:0 24px 60px rgba(76,63,122,.35);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.card h2{font-size:22px;font-weight:800;margin-bottom:12px;background:linear-gradient(90deg,var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.trophy{font-size:54px;line-height:1.1}
.res{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-radius:18px;margin-bottom:8px;font-weight:800;font-size:15px}
.res span:first-child{display:flex;gap:8px;align-items:center;min-width:0}
.card .btn{width:100%;margin-top:8px;font-size:17px}
@media(max-width:700px){.side{width:176px}canvas{height:min(calc(100dvh - 24px),calc((100vw - 200px) * 1.3333))}.top{display:none}}

.side{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 60px rgba(0,0,0,.45)}

textarea{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#fff}
textarea:focus{border-color:#a78bfa}textarea::placeholder{color:#8d85b8}
.row{background:rgba(255,255,255,.07);box-shadow:none}
.cnt,.empty,.clear{color:#9d95c9}.x{color:#7d75a8}
.b-add{background:linear-gradient(135deg,#2dd4bf,#3b82f6);box-shadow:0 6px 20px rgba(45,212,191,.3)}
.b-go{background:linear-gradient(135deg,#ff5fa2,#8b5cf6);box-shadow:0 6px 24px rgba(255,95,162,.4)}
.b-reset{background:linear-gradient(135deg,#5b6396,#3b4272);box-shadow:none}
.arena{position:relative;height:min(calc(100dvh - 24px),calc((100vw - 280px)*1.3333));aspect-ratio:3/4;max-width:100%;border-radius:32px;overflow:hidden;border:2px solid rgba(255,255,255,.18);box-shadow:0 0 0 6px rgba(255,255,255,.04),0 24px 70px rgba(139,92,246,.45)}
.arena svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.nm{font:800 11px 'Be Vietnam Pro',sans-serif;fill:#fff;paint-order:stroke;stroke:rgba(13,10,34,.9);stroke-width:3.5px;stroke-linejoin:round}
.toast,.chip{background:rgba(26,20,64,.88);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.card{background:#1a1440;color:#fff;border:1px solid rgba(255,255,255,.15)}
@media(max-width:700px){.arena{height:min(calc(100dvh - 24px),calc((100vw - 200px)*1.3333))}}

<body>
<div class="app">
 <aside class="side">
  <div class="head"><div><div class="logo">Đua Bi</div><div class="cnt" id="cnt">Sĩ số: 0</div></div><button class="round" id="mute"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button></div>
  <div class="add"><textarea id="names" placeholder="Dán danh sách tên, mỗi dòng một tên"></textarea><button class="btn b-add" id="add">Thêm vào đường đua</button></div>
  <div class="list" id="list"></div>
  <div class="foot"><button class="btn b-go" id="go">Bắt đầu</button><button class="clear" id="clear">Xóa hết</button></div>
 </aside>
 <main class="stage">
  <div class="arena"><svg id="bgs" viewBox="0 0 600 800"></svg><svg id="cv" viewBox="0 0 600 800"><g id="gTr"></g><g id="gSp"></g><g id="gMa"></g><g id="gPa"></g></svg></div>
  <div class="toast" id="toast"></div>
  <div class="top" id="top"></div>

 </main>
</div>
<div class="modal" id="modal"><div class="card"><h2>Kết quả</h2><div id="res"></div><button class="btn b-go" id="next">Tiếp tục</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const {Engine,Bodies,Body,Composite,Constraint,Events,Vector}=Matter;
const W=600,H=800,FY=760,STEP=1000/120,MR0=22;
const PALETTE=['#ff5c7a','#ff9f43','#ffcf3f','#4cd964','#2bd4c6','#4aa3ff','#9a7bff','#ff72cf','#19c3a0','#a5dd3a','#ff7a59','#6d86ff'];
const OB=['#7fd8ff','#b79cff','#ffc46b','#6fe3b5','#8fb4ff','#ff9ccf','#ff8d8d','#b5e35a'];
const colorFor=i=>i<PALETTE.length?PALETTE[i]:`hsl(${Math.round(i*137.5)%360},80%,65%)`;
const rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const medal=i=>`<i class="mb m${i<3?i+1:0}">${i+1}</i>`;

let players=[],status='IDLE',muted=false,idc=0,colc=0,rankN=0,slow=1,spinners=[],timers=[];
const finished=new Set(),trails=new Map(),stuck=new Map(),sprites=new Map();
let particles=[],staticCv=null,ack=null;
const dpr=Math.min(window.devicePixelRatio||1,2);

const eng=Engine.create({positionIterations:8,velocityIterations:6});

/* ===== ÂM THANH (tự tạo bằng WebAudio, không cần tải file) ===== */
function tone(f,d,type='sine',v=.07,k=0){
 if(muted)return;
 try{ack=ack||new (window.AudioContext||window.webkitAudioContext)();const t=ack.currentTime,o=ack.createOscillator(),g=ack.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);if(k)o.frequency.exponentialRampToValueAtTime(f*k,t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ack.destination);o.start(t);o.stop(t+d);}catch(e){}
}
let lastTick=0;
const tick=()=>{const n=performance.now();if(n-lastTick<50)return;lastTick=n;tone(520+Math.random()*520,.09,'sine',.045,1.4)};
const chime=()=>[660,880,1320].forEach((f,i)=>setTimeout(()=>tone(f,.35,'triangle',.1),i*95));

/* ===== SVG ===== */
const NS='http://www.w3.org/2000/svg',mEls=new Map();
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const gTr=$('gTr'),gSp=$('gSp'),gPa=$('gPa'),gMa=$('gMa'),bgs=$('bgs');
function burst(x,y,color,n=14,sp=5,conf=false){
 for(let i=0;i<n&&particles.length<260;i++){
  const sq=conf&&Math.random()>.5,z=conf?rand(5,10):rand(2,5);
  const e=sq?mk('rect',{width:z,height:z,rx:2,fill:color},gPa):mk('circle',{r:z,fill:color},gPa);
  particles.push({e,x,y,vx:(Math.random()-.5)*sp,vy:conf?-Math.random()*sp-4:(Math.random()-.5)*sp,l:1,d:conf?.007:rand(.03,.05),g:conf?.18:0,rot:rand(0,360)});
 }
}
const dims=b=>{const v=b.vertices;return[Math.hypot(v[1].x-v[0].x,v[1].y-v[0].y),Math.hypot(v[2].x-v[1].x,v[2].y-v[1].y)]};
const cloud=(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})" fill="#fff" opacity=".92"><circle cx="0" cy="0" r="20"/><circle cx="26" cy="-10" r="28"/><circle cx="56" cy="0" r="22"/><rect x="-20" y="-2" width="98" height="22" rx="11"/></g>`;
const star=(x,y,k,c)=>`<path transform="translate(${x} ${y}) scale(${k})" d="M0-8 2-2 8 0 2 2 0 8-2 2-8 0-2-2Z" fill="${c}" opacity=".9"/>`;
function buildStatic(){
 gTr.innerHTML=gSp.innerHTML=gPa.innerHTML=gMa.innerHTML='';mEls.clear();particles=[];
 const RB=['#ff6b6b','#ffa94d','#ffe066','#69db7c','#4dabf7','#748ffc','#b197fc'];
 let s=`<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset=".55" stop-color="#d4efff"/><stop offset="1" stop-color="#ffe6f2"/></linearGradient>
 <radialGradient id="sun" cx=".85" cy=".05" r=".5"><stop offset="0" stop-color="#fff3a8" stop-opacity=".95"/><stop offset="1" stop-color="#fff3a8" stop-opacity="0"/></radialGradient>
 <pattern id="stripe" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#fff" opacity=".35"/></pattern>
 <pattern id="chk" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#fff"/><rect width="10" height="10" fill="#4b3f86"/><rect x="10" y="10" width="10" height="10" fill="#4b3f86"/></pattern>
 <radialGradient id="bshine" cx=".32" cy=".28" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <radialGradient id="shade" cx=".38" cy=".32" r=".85"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#5a2d82" stop-opacity=".35"/></radialGradient>
 </defs><rect width="600" height="800" fill="url(#sky)"/><rect width="600" height="800" fill="url(#sun)"/>`;
 s+=RB.map((c,k)=>{const r=250-k*14;return `<path d="M${300-r} 340A${r} ${r} 0 0 1 ${300+r} 340" fill="none" stroke="${c}" stroke-width="14" opacity=".5"/>`}).join('');
 s+=cloud(20,345,1.15)+cloud(470,345,1.15)+cloud(380,60,.9)+cloud(30,520,.8)+cloud(500,560,.9)+cloud(150,215,.7);
 s+=star(70,60,1.6,'#fff')+star(260,40,1.2,'#ffe066')+star(540,150,1.4,'#fff')+star(120,300,1,'#ffe066')+star(560,420,1.3,'#fff')+star(40,640,1.2,'#fff')+star(330,470,1,'#ffe066')+star(210,690,1.1,'#fff')+star(480,720,1.3,'#ffe066');
 s+=`<path d="M0 735Q120 690 260 725T600 705V800H0Z" fill="#c4f1d0"/><path d="M0 760Q160 722 320 752T600 742V800H0Z" fill="#9fe6b8"/>`;
 s+=`<rect y="${FY}" width="600" height="40" fill="url(#chk)"/><rect y="${FY-3}" width="600" height="6" fill="#4b3f86"/>`;
 s+=`<path d="M0 722Q300 746 600 722" fill="none" stroke="#fff" stroke-width="3"/>`;
 for(let i=0;i<15;i++){const x=20+i*40,y=722+Math.sin((x/600)*Math.PI)*17;s+=`<path d="M${x-11} ${y}L${x+11} ${y}L${x} ${y+22}Z" fill="${PALETTE[i%12]}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>`}
 s+=`<rect x="235" y="${FY+9}" width="130" height="24" rx="12" fill="#fff"/><text x="300" y="${FY+27}" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="16" letter-spacing="3" fill="#8b6cff">FINISH</text>`;
 Composite.allBodies(eng.world).forEach(b=>{
  if(b.label==='rail'){const[w,h]=dims(b),c=b.render.fillStyle,r=h/2;
   s+=`<g transform="translate(${b.position.x} ${b.position.y}) rotate(${b.angle*57.2958})"><rect x="${-w/2}" y="${-r+5}" width="${w}" height="${h}" rx="${r}" fill="#6b4fb0" opacity=".22"/>
   <rect x="${-w/2}" y="${-r}" width="${w}" height="${h}" rx="${r}" fill="${c}" stroke="#fff" stroke-width="3"/><rect x="${-w/2}" y="${-r}" width="${w}" height="${h}" rx="${r}" fill="url(#stripe)"/>
   <rect x="${-w/2+r}" y="${-r+2.5}" width="${w-h}" height="${h*.28}" rx="${h*.14}" fill="#fff" opacity=".55"/>
   <circle cx="${-w/2+r}" cy="0" r="${h*.2}" fill="#fff" opacity=".85"/><circle cx="${w/2-r}" cy="0" r="${h*.2}" fill="#fff" opacity=".85"/></g>`}
  else if(b.label==='bumper'){const c=b.render.fillStyle,r=b.circleRadius,x=b.position.x,y=b.position.y;
   s+=`<ellipse cx="${x}" cy="${y+r+2}" rx="${r}" ry="${r*.35}" fill="#6b4fb0" opacity=".2"/><circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="#fff" stroke-width="3.5"/><circle cx="${x}" cy="${y}" r="${r*.62}" fill="#fff" opacity=".4"/><circle cx="${x}" cy="${y}" r="${r*.34}" fill="${c}" stroke="#fff" stroke-width="2"/><ellipse cx="${x-r*.4}" cy="${y-r*.5}" rx="${r*.28}" ry="${r*.15}" fill="#fff" opacity=".85" transform="rotate(-35 ${x-r*.4} ${y-r*.5})"/>`}
 });
 bgs.innerHTML=s;
 spinners.forEach(sp=>{const c=sp.render.fillStyle;sp._el=mk('g',{},gSp);
  sp._el.innerHTML=`<rect x="-45" y="-3" width="90" height="12" rx="6" fill="#6b4fb0" opacity=".2"/><rect x="-45" y="-6" width="90" height="12" rx="6" fill="${c}" stroke="#fff" stroke-width="3"/><rect x="-45" y="-6" width="90" height="12" rx="6" fill="url(#stripe)"/><rect x="-38" y="-4.5" width="76" height="3.5" rx="1.75" fill="#fff" opacity=".6"/><circle r="9" fill="#fff" stroke="${c}" stroke-width="3"/><circle r="3.5" fill="${c}"/>`});
}

/* ===== SINH MAP (có kiểm tra khoảng cách để không kẹt) ===== */
function genMap(mr){
 const keep=[],gap=mr*2+14,add=[];spinners=[];
 const along=(cx,cy,len,a,r)=>{const n=Math.ceil(len/28);for(let i=0;i<=n;i++){const t=(i/n-.5)*len;keep.push({x:cx+Math.cos(a)*t,y:cy+Math.sin(a)*t,r})}};
 const free=(x,y,r)=>keep.every(k=>Math.hypot(k.x-x,k.y-y)>=k.r+r+gap);
 [[90,.6,OB[1]],[510,-.6,OB[3]]].forEach(([x,a,c])=>{add.push(Bodies.rectangle(x,90,320,22,{isStatic:true,angle:a,restitution:.3,label:'rail',render:{fillStyle:c}}));along(x,90,320,a,11)});
 let left=Math.random()<.5;
 [330,490,640].forEach((by,i)=>{const y=by+rand(-15,15),a=rand(.28,.38)*(left?1:-1),x=left?150:450;
  add.push(Bodies.rectangle(x,y,400,14,{isStatic:true,angle:a,restitution:.4,label:'rail',render:{fillStyle:OB[(i*3+2)%8]}}));along(x,y,400,a,7);left=!left});
 let dir=Math.random()<.5?1:-1;
 for(let i=0;i<5;i++)for(let t=0;t<80;t++){const x=rand(110,490),y=rand(170,620);if(!free(x,y,45))continue;
  const s=Bodies.rectangle(x,y,90,10,{label:'spinner',density:.02,frictionAir:0,restitution:.8,render:{fillStyle:pick(OB)}});
  s.plugin={dir};dir=-dir;add.push(Constraint.create({pointA:{x,y},bodyB:s,stiffness:1,length:0}),s);spinners.push(s);keep.push({x,y,r:45});break}
 for(let i=0;i<8;i++)for(let t=0;t<80;t++){const x=rand(60,540),y=rand(170,700);if(!free(x,y,16))continue;
  add.push(Bodies.circle(x,y,16,{isStatic:true,label:'bumper',restitution:1.3,render:{fillStyle:OB[i%8]}}));keep.push({x,y,r:16});break}
 Composite.add(eng.world,add);
}
function setupWorld(mr=MR0){
 const w=eng.world;Composite.clear(w,false,true);eng.gravity.y=2.8;
 Composite.add(w,[Bodies.rectangle(300,950,1200,200,{isStatic:true,label:'ground'}),
  Bodies.rectangle(-25,400,50,1600,{isStatic:true,restitution:.6,label:'wall'}),Bodies.rectangle(625,400,50,1600,{isStatic:true,restitution:.6,label:'wall'})]);
 genMap(mr);buildStatic();
 Events.off(eng,'collisionStart');
 Events.on(eng,'collisionStart',e=>e.pairs.forEach(({bodyA:a,bodyB:b})=>{
  const m=a.label==='marble'?a:b.label==='marble'?b:null;if(!m||m.isSensor)return;
  const o=m===a?b:a;if(m.speed>2)tick();
  if(o.label==='bumper'&&m.plugin){burst(m.position.x,m.position.y,m.plugin.color,10,6);Body.applyForce(m,m.position,{x:(Math.random()-.5)*.006,y:-.004})}
 }));
}

/* ===== BI DỄ THƯƠNG CHI TIẾT ===== */
function makeMarble(info,r){
 const c=info.color,g=mk('g',{},gMa),tr=mk('path',{fill:'none',stroke:c,'stroke-opacity':.35,'stroke-width':r*1,'stroke-linecap':'round','stroke-linejoin':'round'},gTr);
 const nm=info.name.length>9?info.name.slice(0,8)+'…':info.name,pw=nm.length*6.4+14,e=r*.34,ey=-r*.08;
 g.innerHTML=`<ellipse cy="${r*.95}" rx="${r*.85}" ry="${r*.3}" fill="#6b4fb0" opacity=".2"/>
 <circle r="${r}" fill="${c}" stroke="#fff" stroke-width="3"/><circle r="${r}" fill="url(#shade)"/><circle r="${r}" fill="url(#bshine)"/>
 <path d="M${-r*.62} ${r*.55}A${r*.85} ${r*.85} 0 0 0 ${r*.62} ${r*.55}" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="${r*.12}" stroke-linecap="round"/>
 <ellipse cx="${-r*.45}" cy="${-r*.55}" rx="${r*.24}" ry="${r*.12}" fill="#fff" opacity=".9" transform="rotate(-38 ${-r*.45} ${-r*.55})"/>
 <circle cx="${-e}" cy="${ey}" r="${r*.2}" fill="#fff"/><circle cx="${e}" cy="${ey}" r="${r*.2}" fill="#fff"/>
 <circle cx="${-e}" cy="${ey+r*.02}" r="${r*.13}" fill="#2d2255"/><circle cx="${e}" cy="${ey+r*.02}" r="${r*.13}" fill="#2d2255"/>
 <circle cx="${-e+r*.04}" cy="${ey-r*.03}" r="${r*.05}" fill="#fff"/><circle cx="${e+r*.04}" cy="${ey-r*.03}" r="${r*.05}" fill="#fff"/>
 <ellipse cx="${-r*.62}" cy="${r*.27}" rx="${r*.17}" ry="${r*.1}" fill="#ff5a82" opacity=".5"/><ellipse cx="${r*.62}" cy="${r*.27}" rx="${r*.17}" ry="${r*.1}" fill="#ff5a82" opacity=".5"/>
 <path d="M${-r*.2} ${r*.2}Q0 ${r*.46} ${r*.2} ${r*.2}" fill="#ff7a8a" stroke="#2d2255" stroke-width="${Math.max(1.3,r*.07)}" stroke-linecap="round" stroke-linejoin="round"/>
 <rect x="${-pw/2}" y="${r+3}" width="${pw}" height="18" rx="9" fill="#fff" stroke="${c}" stroke-width="2"/><text y="${r+16}" text-anchor="middle" class="nm">${esc(nm)}</text>`;
 return{g,tr};
}

/* ===== VÒNG LẶP: bước vật lý cố định 120Hz + nội suy ===== */
let last=performance.now(),acc=0,endCheck=0;
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(now-last,50);last=now;
 slow+=((rankN>0?.45:1)-slow)*.08;acc+=dt*slow;
 let n=0;
 while(acc>=STEP&&n<8){
  Composite.allBodies(eng.world).forEach(b=>{if(b.label==='marble'){b._px=b.position.x;b._py=b.position.y}});
  spinners.forEach(s=>Body.setAngularVelocity(s,s.plugin.dir*.05));
  Engine.update(eng,STEP);acc-=STEP;n++;
 }
 if(n===8)acc=0;
 const alpha=acc/STEP,bodies=Composite.allBodies(eng.world);
 spinners.forEach(s=>s._el&&s._el.setAttribute('transform',`translate(${s.position.x.toFixed(1)} ${s.position.y.toFixed(1)}) rotate(${(s.angle*57.2958).toFixed(1)})`));
 bodies.forEach(b=>{
  if(b.label!=='marble'||!b.plugin)return;
  const info=b.plugin;
  if(b.speed>26)Body.setVelocity(b,Vector.mult(b.velocity,26/b.speed));
  let st=stuck.get(b.id);if(!st){st={ax:b.position.x,ay:b.position.y,t:0,k:0,gh:0};stuck.set(b.id,st)}
  if(st.gh>0){st.gh-=dt*slow;if(st.gh<=0)b.isSensor=false}
  else{st.t+=dt*slow;if(st.t>=800){
   const mv=Math.hypot(b.position.x-st.ax,b.position.y-st.ay);
   if(mv<14&&b.position.y>0&&b.position.y<FY){st.k++;
    if(st.k>=3){b.isSensor=true;st.gh=450;st.k=0;Body.setVelocity(b,{x:rand(-2,2),y:6})}
    else Body.setVelocity(b,{x:(Math.random()<.5?-1:1)*rand(3,6),y:-rand(3,6)})}
   else st.k=0;
   st.ax=b.position.x;st.ay=b.position.y;st.t=0}}
  if(b.position.y>FY&&!finished.has(info.pid)){
   finished.add(info.pid);const rank=++rankN;chime();burst(b.position.x,FY+10,info.color,28,8);
   const p=players.find(x=>x.id===info.pid);if(p)p.rank=rank;
   showToast(info,rank);renderList();renderTop();
  }
  if(b.position.y>FY+70){Composite.remove(eng.world,b);const m=mEls.get(b.id);if(m){m.g.remove();m.tr.remove();mEls.delete(b.id)}trails.delete(b.id);stuck.delete(b.id);return}
  const x=b._px!==undefined?b._px+(b.position.x-b._px)*alpha:b.position.x,y=b._py!==undefined?b._py+(b.position.y-b._py)*alpha:b.position.y;
  let m=mEls.get(b.id);if(!m){m=makeMarble(info,b.circleRadius);mEls.set(b.id,m)}
  m.g.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)})`);
  let tr=trails.get(b.id);if(!tr){tr=[];trails.set(b.id,tr)}
  tr.push(x,y);if(tr.length>24)tr.splice(0,2);
  if(tr.length>3){let d='M'+tr[0].toFixed(1)+' '+tr[1].toFixed(1);for(let i=2;i<tr.length;i+=2)d+='L'+tr[i].toFixed(1)+' '+tr[i+1].toFixed(1);m.tr.setAttribute('d',d)}
 });
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];
  p.vy+=p.g*slow;p.x+=p.vx*slow;p.y+=p.vy*slow;p.l-=p.d*slow;
  if(p.l<=0){p.e.remove();particles.splice(i,1);continue}
  p.rot+=3;p.e.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${p.rot})`);p.e.setAttribute('opacity',p.l.toFixed(2))}
 if(status==='RACING'&&now-endCheck>300){endCheck=now;
  if(rankN>0&&rankN>=Math.min(players.length,3))celebrate()}
 $('slow').classList.toggle('on',(status==='RACING'||status==='CELEBRATING')&&rankN>0);
}

function celebrate(){
 status='CELEBRATING';
 for(let i=0;i<25;i++)timers.push(setTimeout(()=>burst(Math.random()*W,H,pick(PALETTE),20,15,true),i*80));
 timers.push(setTimeout(showResult,2500));
}
function showResult(){
 status='FINISHED';
 $('res').innerHTML=sorted().slice(0,3).map((w,i)=>`<div class="res" style="background:color-mix(in srgb,${w.color} 22%,#1a1440);border:2px solid ${w.color}"><span>${medal(i)} ${esc(w.name)}</span><span style="color:var(--soft);font-size:12px">#${w.rank}</span></div>`).join('');
 $('modal').classList.add('on');syncBtns();
}
const sorted=()=>players.filter(p=>p.rank).sort((a,b)=>a.rank-b.rank);

/* ===== GIAO DIỆN ===== */
function showToast(p,rank){const t=$('toast');t.classList.remove('show');void t.offsetWidth;
 t.style.border=`3px solid ${p.color}`;t.innerHTML=`<span style="font-size:22px">${medal(rank-1)}</span><span style="color:${p.color}">${esc(p.name)} · HẠNG ${rank}</span>`;t.classList.add('show')}
function renderTop(){$('top').innerHTML=sorted().slice(0,5).map((w,i)=>`<div class="chip" style="border:2px solid ${w.color}">${medal(i)} ${esc(w.name)}</div>`).join('')}
function renderList(){
 $('cnt').textContent='Sĩ số: '+players.length;
 $('list').innerHTML=players.length?players.map(p=>`<div class="row"><div class="n"><span class="dot" style="background:${p.color}"></span><span>${esc(p.name)}</span></div>${p.rank?`<span>${medal(p.rank-1)}</span>`:status==='IDLE'?`<button class="x" data-id="${p.id}">✕</button>`:''}</div>`).join(''):'<div class="empty">Chưa có ai trên đường đua<br>Dán danh sách tên để bắt đầu</div>';
 syncBtns();
}
function syncBtns(){const idle=status==='IDLE',g=$('go');
 g.textContent=idle?'Bắt đầu':'Làm mới';g.className='btn '+(idle?'b-go':'b-reset');g.disabled=idle&&!players.length;
 $('clear').style.display=idle&&players.length?'':'none'}

function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function startRace(){
 if(!players.length)return;clearTimers();
 const mr=players.length<=12?MR0:Math.max(12,MR0-(players.length-12)*.4);
 setupWorld(mr);particles=[];finished.clear();trails.clear();stuck.clear();rankN=0;acc=0;
 players.forEach(p=>p.rank=null);status='RACING';renderList();renderTop();
 try{ack=ack||new (window.AudioContext||window.webkitAudioContext)();ack.resume()}catch(e){}
 const gap=players.length>25?70:100;
 players.forEach((p,i)=>timers.push(setTimeout(()=>{
  const m=Bodies.circle(rand(190,410),-45,mr,{restitution:.5,friction:.001,frictionAir:.005,label:'marble'});
  m.plugin={pid:p.id,color:p.color,name:p.name};Composite.add(eng.world,m)},i*gap)));
}
function resetRace(){
 clearTimers();const w=players.find(p=>p.rank===1);
 players=players.filter(p=>!w||p.id!==w.id).map(p=>({...p,rank:null}));
 status='IDLE';rankN=0;finished.clear();trails.clear();stuck.clear();particles=[];
 $('modal').classList.remove('on');setupWorld(MR0);renderList();renderTop();
}
function addPlayers(){
 const names=$('names').value.split(/\r?\n|,/).map(s=>s.trim()).filter(Boolean);if(!names.length)return;
 names.forEach(n=>players.push({id:'p'+(++idc),name:n,color:colorFor(colc++)}));
 $('names').value='';renderList();
}
$('add').onclick=addPlayers;
$('go').onclick=()=>status==='IDLE'?startRace():resetRace();
$('next').onclick=resetRace;
$('clear').onclick=()=>{players=[];colc=0;renderList()};
$('list').onclick=e=>{const b=e.target.closest('.x');if(b&&status==='IDLE'){players=players.filter(p=>p.id!==b.dataset.id);renderList()}};
$('mute').onclick=()=>{muted=!muted;$('mute').innerHTML=muted?`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>`:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>`};

(document.fonts?document.fonts.load('800 11px "Be Vietnam Pro"').catch(()=>{}):Promise.resolve()).then(()=>{
 setupWorld(MR0);renderList();requestAnimationFrame(t=>{last=t;frame(t)});
});
</script>
